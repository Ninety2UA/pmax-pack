name: Trusted fixture parity

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      execute_manifest:
        description: Execute manifest writes in the fixed CI scratch datasets
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pmax-ci-scratch-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  trusted-parity:
    if: github.repository == 'Ninety2UA/pmax-pack'
    runs-on: ubuntu-latest
    environment: trusted-parity
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      - name: Gitleaks working tree
        run: /tmp/gitleaks detect --source . --no-git --exit-code 1

      - name: Gitleaks git history
        run: /tmp/gitleaks detect --source . --exit-code 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          version: "0.10.4"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Lint SQL dataset references
        run: uv run python scripts/lint_dataset_refs.py

      - name: Authenticate by direct WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PMAX_WIF_PROVIDER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Fixture-source BigQuery parity
        env:
          PMAX_CI_SCRATCH_PROJECT: ${{ vars.PMAX_GCP_PROJECT }}
        run: uv run pmax-pack parity --source fixtures

      - name: Manifest dry-runs and fixture parity (scratch)
        env:
          PMAX_CI_SCRATCH_PROJECT: ${{ vars.PMAX_GCP_PROJECT }}
        run: |
          uv run python - <<'PY'
          from datetime import date
          from types import SimpleNamespace
          import os
          from google.cloud import bigquery
          from pmax_pack.config import Datasets, Tolerances
          from pmax_pack.loader import ensure_table
          from pmax_pack.pipeline import RunContext
          from pmax_pack.runner import load_manifest, render
          from pmax_pack.schema import OBSERVATION_TABLE, OPS_TABLES
          import pmax_pack.parity as parity

          project = os.environ["PMAX_CI_SCRATCH_PROJECT"]
          datasets = Datasets(
              raw="pmax_ci_scratch",
              marts="pmax_ci_scratch",
              ops="pmax_ci_scratch",
              ci_scratch="pmax_ci_scratch",
              ci_scratch_bq="pmax_ci_scratch_bq",
          )
          config = SimpleNamespace(
              deployment=SimpleNamespace(project=project),
              datasets=datasets,
              tolerances=Tolerances(),
              cohort_days=[1, 3, 7, 14, 30, 60, 90],
          )
          ctx = RunContext(
              run_id="trusted-ci-dry-run",
              mode="rebuild",
              as_of=date(2026, 8, 20),
              accounts_configured=[],
              accounts_resolved=[],
              image_digest="sha256:fixture",
              credential_fingerprint="fixture",
              checkpoint_hash="fixture",
              window_start=date(2026, 5, 22),
              window_end=date(2026, 8, 20),
              timezone="UTC",
              dry_run=True,
          )
          client = bigquery.Client(project=project)
          created_tables = {
              "pmax_ci_scratch": set(),
              "pmax_ci_scratch_bq": set(),
          }
          try:
              result = parity.run_fixture_parity_bq(
                  bq_client=client,
                  project=project,
                  created_tables=created_tables,
              )
              if not result.passed:
                  raise SystemExit("fixture materialization parity failed")
              for name in ("stages", "first_snapshot"):
                  ensure_table(
                      client,
                      OPS_TABLES[name],
                      project=project,
                      dataset="pmax_ci_scratch",
                  )
                  created_tables["pmax_ci_scratch"].add(OPS_TABLES[name].name)
              ensure_table(
                  client,
                  OBSERVATION_TABLE,
                  project=project,
                  dataset="pmax_ci_scratch",
              )
              created_tables["pmax_ci_scratch"].add(OBSERVATION_TABLE.name)
              manifest = load_manifest("src/pmax_pack/manifest.yaml")
              for step in manifest.steps:
                  sql = render(step, config, ctx)
                  params = []
                  if "@as_of" in sql:
                      params.append(bigquery.ScalarQueryParameter("as_of", "DATE", ctx.as_of))
                  if "@run_id" in sql:
                      params.append(bigquery.ScalarQueryParameter("run_id", "STRING", ctx.run_id))
                  job_config = bigquery.QueryJobConfig(
                      dry_run=True,
                      use_query_cache=False,
                      query_parameters=params,
                  )
                  client.query(sql, job_config=job_config)
                  print(f"dry-run {step.name}")
          finally:
              parity.cleanup_scratch(
                  client,
                  project,
                  created_tables,
              )
          PY

      - name: Execute manifest writes on explicit dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.execute_manifest
        env:
          PMAX_CI_SCRATCH_PROJECT: ${{ vars.PMAX_GCP_PROJECT }}
          PMAX_EXECUTE_MANIFEST: "true"
        run: |
          echo "Explicit manifest execution is enabled for this manual dispatch."
          uv run python - <<'PY'
          from datetime import date
          from types import SimpleNamespace
          import os
          from google.cloud import bigquery
          from pmax_pack.config import Datasets, Tolerances
          from pmax_pack.pipeline import RunContext
          from pmax_pack.runner import load_manifest, render

          project = os.environ["PMAX_CI_SCRATCH_PROJECT"]
          datasets = Datasets(
              raw="pmax_ci_scratch",
              marts="pmax_ci_scratch",
              ops="pmax_ci_scratch",
              ci_scratch="pmax_ci_scratch",
              ci_scratch_bq="pmax_ci_scratch_bq",
          )
          config = SimpleNamespace(
              deployment=SimpleNamespace(project=project),
              datasets=datasets,
              tolerances=Tolerances(),
              cohort_days=[1, 3, 7, 14, 30, 60, 90],
          )
          ctx = RunContext(
              run_id="trusted-ci-manual-execute",
              mode="rebuild",
              as_of=date(2026, 8, 20),
              accounts_configured=[],
              accounts_resolved=[],
              image_digest="sha256:fixture",
              credential_fingerprint="fixture",
              checkpoint_hash="fixture",
              window_start=date(2026, 5, 22),
              window_end=date(2026, 8, 20),
              timezone="UTC",
              dry_run=False,
          )
          client = bigquery.Client(project=project)
          for step in load_manifest("src/pmax_pack/manifest.yaml").steps:
              if step.kind == "assertion":
                  continue
              sql = render(step, config, ctx)
              params = []
              if "@as_of" in sql:
                  params.append(bigquery.ScalarQueryParameter("as_of", "DATE", ctx.as_of))
              if "@run_id" in sql:
                  params.append(bigquery.ScalarQueryParameter("run_id", "STRING", ctx.run_id))
              job_config = bigquery.QueryJobConfig(
                  use_query_cache=False,
                  query_parameters=params,
                  maximum_bytes_billed=10 * 1024 * 1024 * 1024,
              )
              client.query(sql, job_config=job_config).result()
              print(f"executed {step.name}")
          PY
