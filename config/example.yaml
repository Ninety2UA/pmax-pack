# Example operator config. Placeholder values only; never real accounts,
# projects, or credentials.

accounts:
  - "1234567890"

bulk_expansion: false
# mcc: "1234567890"

# Keep a rolling window or accumulate history; upgrades require an explicit choice.
storage: window
# Positive day count; warns below the largest rung plus one plus the margin.
reporting_window_days: 90
# Incremental history must start on a month's first day; ignored in window mode.
# start_date: "2026-05-01"
# Without a start, incremental mode rounds the window start down to month day one.

# Non-negative extra days for conversion restatements.
restatement_margin_days: 7

# Shared ladder from {0..14, 21, 30, 45, 60, 90}; D0 applies at asset grain only.
cohort_days: [0, 1, 3, 5, 7, 14, 30]

# Environment label: prod, verify, parity, or ci.
env: prod
# Unique user:<email> or serviceAccount:<email> entries; no whitespace or controls.
editors: []
# Same email-principal list shape; one Looker service agent per organization.
looker_service_agents: []

# Reconciliation tolerance fractions.
tolerances:
  campaign_reconciliation: 0.01
  asset_vs_campaign: 0.0
  cross_grain: 0.0
  parity: 0.01

# Deploy preflight requires an explicit IANA timezone for Scheduler and cohorts.
timezone_override: "Europe/Berlin"

deployment:
  project: your-project-id
  region: europe-west1

datasets:
  raw: pmax_raw
  marts: pmax_marts
  ops: pmax_ops
  snapshots: pmax_snapshots
  parity_scratch: pmax_parity_scratch
  parity_scratch_bq: pmax_parity_scratch_bq
  ci_scratch: pmax_ci_scratch
  ci_scratch_bq: pmax_ci_scratch_bq
  marts_verify: pmax_marts_verify

buckets:
  report_bucket: your-report-bucket
  config_bucket: your-config-bucket

api_version: v25
