version: 2
steps:
  - name: mart_performance_campaign
    kind: ddl
    sql: ddl/mart_performance_campaign.sql
    depends_on: []
    partition_field: date
    clustering_fields: [account_id, campaign_id]
  - name: mart_performance_asset_group
    kind: ddl
    sql: ddl/mart_performance_asset_group.sql
    depends_on: []
    partition_field: date
    clustering_fields: [account_id, campaign_id, asset_group_id]
  - name: mart_performance_asset
    kind: ddl
    sql: ddl/mart_performance_asset.sql
    depends_on: []
    partition_field: date
    clustering_fields: [account_id, campaign_id, asset_id]
  - name: mart_asset_performance
    kind: ddl
    sql: ddl/mart_asset_performance.sql
    depends_on: []
    partition_field: date
    clustering_fields: [account_id, campaign_id, asset_id]
  - name: mart_campaign_truth
    kind: ddl
    sql: ddl/mart_campaign_truth.sql
    depends_on: []
    partition_field: date
    clustering_fields: [account_id, campaign_id]
  - name: mart_entities_campaign
    kind: ddl
    sql: ddl/mart_entities_campaign.sql
    depends_on: []
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id]
  - name: mart_entities_asset_group
    kind: ddl
    sql: ddl/mart_entities_asset_group.sql
    depends_on: []
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id, asset_group_id]
  - name: mart_entities_asset
    kind: ddl
    sql: ddl/mart_entities_asset.sql
    depends_on: []
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id, asset_id]
  - name: mart_entities_asset_group_signal
    kind: ddl
    sql: ddl/mart_entities_asset_group_signal.sql
    depends_on: []
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id, asset_group_id]
  - name: mart_entities_campaign_asset
    kind: ddl
    sql: ddl/mart_entities_campaign_asset.sql
    depends_on: []
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id, asset_id]
  - name: mart_entities_conversion_action
    kind: ddl
    sql: ddl/mart_entities_conversion_action.sql
    depends_on: []
    partition_field: snapshot_date
    clustering_fields: [account_id, conversion_action_id]
  - name: mart_entities_customer
    kind: ddl
    sql: ddl/mart_entities_customer.sql
    depends_on: []
    partition_field: snapshot_date
    clustering_fields: [account_id]

  - name: stg_performance
    kind: table
    sql: stg/stg_performance.sql
    depends_on: []
    partition_field: date
    clustering_fields: [account_id, campaign_id]
  - name: stg_entities
    kind: table
    sql: stg/stg_entities.sql
    depends_on: []
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id]
  - name: int_entities
    kind: table
    sql: int/int_entities.sql
    depends_on: [stg_entities]
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id]
  - name: v_int_entities_campaign
    kind: view
    sql: views/v_int_entities_campaign.sql
    depends_on: [int_entities]
  - name: v_int_entities_asset_group
    kind: view
    sql: views/v_int_entities_asset_group.sql
    depends_on: [int_entities]
  - name: v_int_entities_asset
    kind: view
    sql: views/v_int_entities_asset.sql
    depends_on: [int_entities]
  - name: v_int_entities_asset_group_signal
    kind: view
    sql: views/v_int_entities_asset_group_signal.sql
    depends_on: [int_entities]
  - name: v_int_entities_campaign_asset
    kind: view
    sql: views/v_int_entities_campaign_asset.sql
    depends_on: [int_entities]
  - name: v_int_entities_conversion_action
    kind: view
    sql: views/v_int_entities_conversion_action.sql
    depends_on: [int_entities]
  - name: v_int_entities_customer
    kind: view
    sql: views/v_int_entities_customer.sql
    depends_on: [int_entities]
  - name: int_performance
    kind: table
    sql: int/int_performance.sql
    depends_on:
      - stg_performance
      - v_int_entities_campaign
      - v_int_entities_asset_group
      - v_int_entities_asset
      - v_int_entities_conversion_action
      - v_int_entities_customer
    partition_field: date
    clustering_fields: [account_id, campaign_id]

  - name: build_mart_entities_campaign
    kind: table
    sql: mart/mart_entities_campaign.sql
    depends_on: [mart_entities_campaign, v_int_entities_campaign]
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id]
  - name: build_mart_entities_asset_group
    kind: table
    sql: mart/mart_entities_asset_group.sql
    depends_on: [mart_entities_asset_group, v_int_entities_asset_group]
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id, asset_group_id]
  - name: build_mart_entities_asset
    kind: table
    sql: mart/mart_entities_asset.sql
    depends_on: [mart_entities_asset, v_int_entities_asset]
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id, asset_id]
  - name: build_mart_entities_asset_group_signal
    kind: table
    sql: mart/mart_entities_asset_group_signal.sql
    depends_on: [mart_entities_asset_group_signal, v_int_entities_asset_group_signal]
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id, asset_group_id]
  - name: build_mart_entities_campaign_asset
    kind: table
    sql: mart/mart_entities_campaign_asset.sql
    depends_on: [mart_entities_campaign_asset, v_int_entities_campaign_asset]
    partition_field: snapshot_date
    clustering_fields: [account_id, campaign_id, asset_id]
  - name: build_mart_entities_conversion_action
    kind: table
    sql: mart/mart_entities_conversion_action.sql
    depends_on: [mart_entities_conversion_action, v_int_entities_conversion_action]
    partition_field: snapshot_date
    clustering_fields: [account_id, conversion_action_id]
  - name: build_mart_entities_customer
    kind: table
    sql: mart/mart_entities_customer.sql
    depends_on: [mart_entities_customer, v_int_entities_customer]
    partition_field: snapshot_date
    clustering_fields: [account_id]
  - name: build_mart_performance_campaign
    kind: table
    sql: mart/mart_performance_campaign.sql
    depends_on: [mart_performance_campaign, int_performance]
    partition_field: date
    clustering_fields: [account_id, campaign_id]
  - name: build_mart_performance_asset_group
    kind: table
    sql: mart/mart_performance_asset_group.sql
    depends_on: [mart_performance_asset_group, int_performance]
    partition_field: date
    clustering_fields: [account_id, campaign_id, asset_group_id]
  - name: build_mart_performance_asset
    kind: table
    sql: mart/mart_performance_asset.sql
    depends_on: [mart_performance_asset, int_performance]
    partition_field: date
    clustering_fields: [account_id, campaign_id, asset_id]
  - name: build_mart_asset_performance
    kind: table
    sql: mart/mart_asset_performance.sql
    depends_on: [mart_asset_performance, build_mart_performance_asset]
    partition_field: date
    clustering_fields: [account_id, campaign_id, asset_id]
  - name: build_mart_campaign_truth
    kind: table
    sql: mart/mart_campaign_truth.sql
    depends_on: [mart_campaign_truth, int_performance]
    partition_field: date
    clustering_fields: [account_id, campaign_id]

  - name: v_performance_campaign
    kind: view
    sql: views/v_performance_campaign.sql
    depends_on: [build_mart_performance_campaign]
  - name: v_performance_asset_group
    kind: view
    sql: views/v_performance_asset_group.sql
    depends_on: [build_mart_performance_asset_group]
  - name: v_performance_asset
    kind: view
    sql: views/v_performance_asset.sql
    depends_on: [build_mart_performance_asset]
  - name: v_asset_performance
    kind: view
    sql: views/v_asset_performance.sql
    depends_on: [build_mart_asset_performance]
  - name: v_campaign_truth
    kind: view
    sql: views/v_campaign_truth.sql
    depends_on: [build_mart_campaign_truth]

  - name: assert_unique_keys
    kind: assertion
    sql: assertions/assert_unique_keys.sql
    depends_on:
      - build_mart_performance_campaign
      - build_mart_performance_asset_group
      - build_mart_performance_asset
      - build_mart_asset_performance
      - build_mart_campaign_truth
      - build_mart_entities_campaign
      - build_mart_entities_asset_group
      - build_mart_entities_asset
      - build_mart_entities_asset_group_signal
      - build_mart_entities_campaign_asset
      - build_mart_entities_conversion_action
      - build_mart_entities_customer
    severity: HARD
  - name: assert_not_null
    kind: assertion
    sql: assertions/assert_not_null.sql
    depends_on:
      - build_mart_performance_campaign
      - build_mart_performance_asset_group
      - build_mart_asset_performance
    severity: HARD
  - name: assert_row_count_floor
    kind: assertion
    sql: assertions/assert_row_count_floor.sql
    depends_on: [stg_performance, build_mart_campaign_truth]
    severity: HARD
  - name: assert_family_coherence
    kind: assertion
    sql: assertions/assert_family_coherence.sql
    depends_on:
      - build_mart_performance_campaign
      - build_mart_entities_campaign
      - build_mart_entities_asset_group
      - build_mart_entities_asset
      - build_mart_entities_asset_group_signal
      - build_mart_entities_campaign_asset
      - build_mart_entities_conversion_action
    severity: HARD
