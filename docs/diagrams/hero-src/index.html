<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=640" />
    <title>pMax README hero</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #ffffff; --glow: #e9f5ef; --ink: #12302a; --ink2: #2c4a42; --muted: #5b6f69;
        --em: #0f7a5a; --em-deep: #0b5e45; --mint: #cdeadb; --line: #c3d9cf; --card: #ffffff;
        --card-edge: #dbe8e2; --bar: #dfe7e4; --aged-head: #a7bab2; --aged-fill: #e8efec; --cell-old: #e3eae7;
        --shadow: 0 12px 30px rgba(15, 70, 52, 0.13); --zone: #f2f8f5; --beam: #cfe2d9; --floor: rgba(15, 70, 52, 0.16);
        --slab-edge: drop-shadow(0 2px 0 rgba(11, 94, 69, 0.32)) contrast(1.08) brightness(0.97);
      }
      :root[data-theme="dark"] {
        --bg: #0d1117; --glow: #12241e; --ink: #e6edf3; --ink2: #c9d6d1; --muted: #9fb0aa;
        --em: #2fb886; --em-deep: #1f9a6e; --mint: #1e4d3d; --line: #2c4a40; --card: #161b22;
        --card-edge: #2a3a34; --bar: #2b3833; --aged-head: #4a5f58; --aged-fill: #1f2a27; --cell-old: #222c29;
        --shadow: 0 12px 30px rgba(0, 0, 0, 0.45); --zone: #111b18; --beam: #23413a; --floor: rgba(0, 0, 0, 0.55);
        --slab-edge: none;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1600px; height: 640px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1600px; height: 640px; overflow: hidden; background: var(--bg);
        font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
      #bg { position: absolute; left: 100px; top: 150px; width: 1400px; height: 460px; border-radius: 50%;
        background: radial-gradient(ellipse at center, var(--glow) 0%, transparent 70%); }
      #world { position: absolute; left: 0; top: 0; width: 1600px; height: 640px; }
      .abs { position: absolute; display: block; }
      #beams { left: 0; top: 0; z-index: 1; overflow: visible; }
      #pulses { filter: drop-shadow(0 0 5px var(--em)); }
      #zone { left: 252px; top: 196px; width: 462px; height: 322px; border-radius: 26px; background: var(--zone); z-index: 1; }
      #zone-cap { left: 540px; top: 208px; width: 156px; text-align: right; font-size: 21px; font-weight: 700; color: var(--em-deep); z-index: 2; }
      .floor { position: absolute; display: block; border-radius: 50%; z-index: 2; background: radial-gradient(ellipse at center, var(--floor) 0%, transparent 70%); }
      .obj { position: absolute; display: block; z-index: 4; }
      #job { left: 727px; top: 26px; width: 146px; height: 156px; z-index: 6; }
      #job-glow { left: 705px; top: 8px; width: 190px; height: 190px; border-radius: 50%; z-index: 5;
        background: radial-gradient(circle, var(--em) 0%, transparent 65%); opacity: 0; }
      #job-cap { left: 395px; top: 66px; width: 315px; text-align: right; z-index: 4; }
      #job-cap b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -0.015em; }
      #job-cap span { display: block; font-size: 20px; font-weight: 500; color: var(--muted); margin-top: 4px; }
      #src { left: 42px; top: 236px; width: 186px; height: 235px; }
      .row { position: absolute; left: 0; top: 0; width: 52px; height: 11px; border-radius: 6px; z-index: 10; visibility: hidden; }
      .row.a { background: var(--em); } .row.b { background: var(--em-deep); opacity: 0.75; }
      .slab { position: absolute; left: 270px; width: 230px; height: 143px; display: block; }
      #lid { left: 500px; top: 264px; width: 200px; height: 124px; filter: var(--slab-edge); }
      .hist { background: url(assets/slab-history.png) center / 100% 100% no-repeat; filter: var(--slab-edge); }
      #lid-mask { position: absolute; left: 500px; top: 264px; width: 200px; height: 124px; overflow: hidden; z-index: 9;
        -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
      #lid-sweep { position: absolute; left: 0; top: 0; width: 120px; height: 100%; display: block;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9) 45%, rgba(47, 184, 134, 0.55) 60%, transparent); }
      .spark { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--em); z-index: 9; visibility: hidden; }
      #portal { left: 742px; top: 262px; width: 96px; height: 176px; z-index: 4; overflow: visible; }
      #pass { left: 768px; top: 236px; width: 44px; height: 44px; z-index: 8; overflow: visible; }
      .pkt { position: absolute; left: 0; top: 0; width: 36px; height: 20px; border-radius: 5px; background: var(--em); z-index: 5; visibility: hidden; }
      .pkt::after { content: ""; position: absolute; left: 7px; right: 7px; top: 6px; height: 7px;
        border-top: 2px solid #fff; border-bottom: 2px solid #fff; }
      #plate { left: 878px; top: 278px; width: 324px; height: 144px; z-index: 6; border-radius: 18px; background: var(--card);
        border: 1.5px solid var(--card-edge); box-shadow: var(--shadow); padding: 16px;
        display: grid; grid-template-columns: repeat(4, 64px); grid-auto-rows: 50px; gap: 12px; justify-content: center; }
      #plate-ring { left: 878px; top: 278px; width: 324px; height: 144px; border-radius: 18px; border: 3px solid var(--em); z-index: 7; opacity: 0; }
      .card { position: relative; display: block; width: 64px; height: 50px; transform-style: preserve-3d; }
      .face { position: absolute; inset: 0; border-radius: 7px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      .face::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: var(--head); }
      .face::after { content: ""; position: absolute; left: 8px; right: 8px; top: 20px; height: 17px;
        border-top: 2.5px solid rgba(255, 255, 255, 0.95); border-bottom: 2.5px solid rgba(255, 255, 255, 0.95); }
      .aged { --head: var(--aged-head); background: var(--aged-fill); }
      .fresh { --head: var(--em); background: var(--mint); }
      .fresh-ov { position: absolute; inset: 0; border-radius: 7px; overflow: hidden; opacity: 0; }
      .back { transform: rotateX(180deg); }
      #dash { left: 1308px; top: 220px; width: 195px; height: 250px; z-index: 4; }
      #chart { z-index: 5; overflow: visible; transform-origin: 0 0; }
      #strip { left: 790px; top: 528px; width: 810px; height: 64px; z-index: 4;
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 70px, #000 740px, transparent 810px);
        mask-image: linear-gradient(90deg, transparent 0, #000 70px, #000 740px, transparent 810px); }
      .win { position: absolute; top: 0; height: 64px; overflow: hidden; }
      .cells { position: absolute; left: 0; top: 17px; height: 30px; width: 1000px; }
      .cell { position: absolute; top: 0; width: 26px; height: 30px; border-radius: 6px; display: block; }
      .w-old .cell { background: var(--cell-old); }
      .w-in .cell { background: var(--em); }
      .w-new .cell { border: 2px dashed var(--line); }
      #band { left: 1072px; top: 538px; width: 242px; height: 44px; border-radius: 10px; border: 2.5px solid var(--em-deep); z-index: 5; }
      #newday { left: 1282px; top: 545px; width: 26px; height: 30px; border-radius: 6px; background: #ffffff; z-index: 5; opacity: 0; }
      #strip-cap { left: 420px; top: 545px; width: 350px; text-align: right; font-size: 21px; font-weight: 600; color: var(--ink2); z-index: 4; }
      .name { position: absolute; top: 486px; width: 240px; text-align: center; font-size: 22px; font-weight: 650; color: var(--ink2); z-index: 4; }
      #report { left: 905px; top: 40px; width: 250px; height: 140px; z-index: 5; border-radius: 14px; background: var(--card);
        border: 1.5px solid var(--card-edge); box-shadow: var(--shadow); padding: 15px 18px; visibility: hidden; }
      #report h3 { font-size: 23px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
      #report p { font-size: 16px; font-weight: 500; color: var(--muted); margin-top: 3px; }
      .rrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; height: 18px; }
      .rrow + .rrow { margin-top: 7px; }
      .tick { display: block; width: 18px; height: 18px; flex: none; }
      .bar { display: block; height: 10px; border-radius: 5px; background: var(--bar); transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1600" data-height="640" data-duration="10" data-fps="30"
      data-composition-variables='[{"id":"theme","type":"string","label":"Theme","default":"light"},{"id":"still","type":"boolean","label":"Hold the wide camera","default":false}]'>
      <div id="bg"></div>
      <div id="world">
        <svg id="beams" class="abs" width="1600" height="640" viewBox="0 0 1600 640" aria-hidden="true">
          <g fill="none" stroke="var(--beam)" stroke-width="2.5" stroke-linecap="round">
            <path id="b1" d="M800 182 C800 226 135 196 135 240" /><path id="b2" d="M800 182 C800 226 600 228 600 272" />
            <path id="b3" d="M800 182 C800 210 790 226 790 258" /><path id="b4" d="M800 182 C800 230 1040 226 1040 276" />
          </g>
          <g id="pulses" fill="none" stroke="var(--em)" stroke-width="6" stroke-linecap="round">
            <path id="p1" class="pulse" /><path id="p2" class="pulse" /><path id="p3" class="pulse" /><path id="p4" class="pulse" />
          </g>
          <g fill="var(--em)">
            <circle id="r1" class="rcv" r="6" /><circle id="r2" class="rcv" r="6" /><circle id="r3" class="rcv" r="6" /><circle id="r4" class="rcv" r="6" />
          </g>
        </svg>

        <div id="zone" class="abs"></div>
        <div id="zone-cap" class="abs">BigQuery</div>
        <i class="floor" style="left: 35px; top: 462px; width: 200px; height: 30px"></i>
        <i class="floor" style="left: 265px; top: 462px; width: 240px; height: 32px"></i>
        <i class="floor" style="left: 505px; top: 420px; width: 190px; height: 26px; opacity: 0.6"></i>
        <i class="floor" style="left: 735px; top: 428px; width: 110px; height: 22px"></i>
        <i class="floor" style="left: 870px; top: 418px; width: 340px; height: 30px"></i>
        <i class="floor" style="left: 1305px; top: 460px; width: 200px; height: 28px"></i>
        <div id="job-glow" class="abs"></div>
        <img id="job" class="obj" src="assets/job.png" alt="" />
        <div id="job-cap" class="abs"><b>one Cloud Run Job</b><span>runs every step, every night</span></div>

        <img id="src" class="obj" src="assets/source.png" alt="" />
        <div id="rows"></div>

        <div id="h0" class="slab hist" style="z-index: 4"></div>
        <div id="h1" class="slab hist" style="z-index: 5"></div>
        <div id="h2" class="slab hist" style="z-index: 6"></div>
        <div id="hn" class="slab hist" style="z-index: 7"></div>
        <img id="lid" class="slab" src="assets/slab-mart.png" alt="" style="z-index: 8" />
        <div id="lid-mask"><i id="lid-sweep" data-layout-allow-overflow="true"></i></div>
        <div id="sparks"></div>

        <svg id="portal" class="abs" viewBox="0 0 96 176" aria-hidden="true">
          <rect x="4" y="4" width="88" height="168" rx="18" fill="var(--zone)" stroke="var(--em-deep)" stroke-width="6" />
          <rect id="portal-on" x="7" y="7" width="82" height="162" rx="15" fill="var(--em)" opacity="0" />
          <line id="laser" x1="12" y1="0" x2="84" y2="0" stroke="var(--em)" stroke-width="4" stroke-linecap="round" opacity="0" />
        </svg>
        <div id="pkts"></div>
        <div id="lpkts"></div>
        <svg id="pass" class="abs" viewBox="0 0 44 44" aria-hidden="true">
          <circle cx="22" cy="22" r="20" fill="var(--em)" stroke="var(--bg)" stroke-width="3" />
          <path d="M13 23 L19.5 29.5 L31 16" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

        <div id="plate" class="abs"></div>
        <div id="plate-ring" class="abs"></div>

        <img id="dash" class="obj" src="assets/dashboard-blank.png" alt="" />
        <svg id="chart" class="abs" aria-hidden="true">
          <g id="chart-old"><path class="area" d="M12.8 65.3 L27.5 50.6 L42.2 58.0 L56.8 37.9 L71.5 46.4 L86.1 28.5 L100.8 34.8 L115.5 19.0 L115.5 90.6 L12.8 90.6 Z" /><path class="line" d="M12.8 65.3 L27.5 50.6 L42.2 58.0 L56.8 37.9 L71.5 46.4 L86.1 28.5 L100.8 34.8 L115.5 19.0" /></g>
          <g id="chart-new"><path class="area" d="M12.8 65.3 L27.5 50.6 L42.2 58.0 L56.8 37.9 L71.5 46.4 L86.1 28.5 L100.8 34.8 L115.5 19.0 L115.5 90.6 L12.8 90.6 Z" /><path class="line" d="M12.8 65.3 L27.5 50.6 L42.2 58.0 L56.8 37.9 L71.5 46.4 L86.1 28.5 L100.8 34.8 L115.5 19.0" /></g>
        </svg>

        <div id="strip-cap" class="abs">reporting window, restated nightly</div>
        <div id="strip" class="abs">
          <div class="win w-old" style="left: 0; width: 282px"><div class="cells" data-layout-allow-overflow="true"></div></div>
          <div class="win w-in" style="left: 282px; width: 242px"><div class="cells" data-layout-allow-overflow="true"></div></div>
          <div class="win w-new" style="left: 524px; width: 286px"><div class="cells" data-layout-allow-overflow="true"></div></div>
        </div>
        <div id="band" class="abs"></div>
        <div id="newday" class="abs"></div>

        <div class="name" style="left: 15px">Google Ads</div>
        <div class="name" style="left: 265px">typed history</div>
        <div class="name" style="left: 480px">validated marts</div>
        <div class="name" style="left: 670px">validation</div>
        <div class="name" style="left: 920px">8 reporting tables</div>
        <div class="name" style="left: 1285px">Looker Studio</div>

        <div id="report" class="abs">
          <h3>run report</h3>
          <p>what this run could prove</p>
          <div class="rrow"><svg class="tick" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="var(--em)" /><path d="M5 9.3 L7.8 12.1 L13 6.3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg><i class="bar" style="width: 160px"></i></div>
          <div class="rrow"><svg class="tick" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="var(--em)" /><path d="M5 9.3 L7.8 12.1 L13 6.3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg><i class="bar" style="width: 126px"></i></div>
          <div class="rrow"><svg class="tick" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="var(--em)" /><path d="M5 9.3 L7.8 12.1 L13 6.3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg><i class="bar" style="width: 146px"></i></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        let vars = {};
        try { vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {}; } catch (e) {}
        if (vars.theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
        const still = vars.still === true || vars.still === "true";   // reduced-motion still: no camera moves

        const $ = (s) => document.querySelector(s);
        const px = (v) => v + "px";

        // Typed-history stack (slab 230x143, pitch 20): three layers and an empty slot on top.
        const HS = 143, P = 20, H0 = 470 - HS, slotTop = H0 - 3 * P;
        ["#h0", "#h1", "#h2"].forEach((s, i) => { $(s).style.top = px(H0 - i * P); });
        $("#hn").style.top = px(slotTop);
        Object.assign($("#lid-mask").style, { webkitMaskImage: "url(assets/slab-mart.png)", maskImage: "url(assets/slab-mart.png)" });

        // Looker Studio screen overlay: the blank screen face is a vertical parallelogram skewed 15.5 degrees.
        const S = { x: 30.4, y: 36.4, w: 128.3, h: 105.4, skew: 15.5 };
        Object.assign($("#chart").style, { left: px(1308 + S.x), top: px(220 + S.y), width: px(S.w), height: px(S.h), transform: "skewY(" + S.skew + "deg)" });
        $("#chart").setAttribute("viewBox", "0 0 " + S.w + " " + S.h);
        document.querySelectorAll("#chart .area").forEach((a) => a.setAttribute("fill", "var(--mint)"));
        document.querySelectorAll("#chart .line").forEach((l) => {
          Object.assign(l.style, { fill: "none", stroke: "var(--em)", strokeWidth: "4", strokeLinecap: "round", strokeLinejoin: "round" }); });

        const mk = (parent, cls, n) => Array.from({ length: n }, () => { const d = document.createElement("div"); d.className = cls; $(parent).appendChild(d); return d; });
        const rows = mk("#rows", "row", 14); rows.forEach((r, i) => r.classList.add(i % 2 ? "b" : "a"));
        const sparks = mk("#sparks", "spark", 4);
        const pkts = mk("#pkts", "pkt", 4);
        const lpkts = mk("#lpkts", "pkt", 3);
        const cards = Array.from({ length: 8 }, () => {
          const c = document.createElement("div"); c.className = "card";
          c.innerHTML = '<div class="face aged"><div class="fresh-ov face fresh"></div></div><div class="face fresh back"></div>';
          $("#plate").appendChild(c); return c;
        });
        document.querySelectorAll("#strip .cells").forEach((row) => {
          const winLeft = parseFloat(row.parentElement.style.left);
          for (let k = -2; k < 24; k++) { const c = document.createElement("i"); c.className = "cell"; c.style.left = px(50 + k * 34 - winLeft); row.appendChild(c); }
        });

        // Beams: every stage is started by a pulse from the job.
        const pulses = [1, 2, 3, 4].map((k) => {
          const b = $("#b" + k), p = $("#p" + k), r = $("#r" + k);
          p.setAttribute("d", b.getAttribute("d"));
          const L = b.getTotalLength(), end = b.getPointAtLength(L);
          p.style.strokeDasharray = "60 " + (L + 70); p.style.strokeDashoffset = 60;
          r.setAttribute("cx", end.x); r.setAttribute("cy", end.y);
          return { p, r, L };
        });

        const tl = gsap.timeline({ paused: true });
        const fire = (k, t) => {
          const { p, r, L } = pulses[k - 1];
          tl.fromTo(p, { strokeDashoffset: 60 }, { strokeDashoffset: -L + 60, duration: 0.38, ease: "power2.in" }, t)
            .set(p, { strokeDashoffset: 60 }, t + 0.4)
            .fromTo(r, { scale: 1, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.45, ease: "power2.out", svgOrigin: r.getAttribute("cx") + " " + r.getAttribute("cy") }, t + 0.38)
            .set(r, { scale: 1, opacity: 1 }, t + 0.86);
          return t + 0.38;
        };

        // Camera: wide, push toward publication, push again for the swap, pull back as the night completes.
        gsap.set("#world", { transformOrigin: "600px 330px" });   // max scale 1.055 keeps all objects at least 9 px inside
        gsap.set("#bg", { transformOrigin: "500px 180px" });
        if (!still) {
        tl.fromTo("#world", { scale: 1 }, { scale: 1.028, duration: 0.7, ease: "power2.inOut" }, 4.0)
          .to("#world", { scale: 1.055, duration: 0.6, ease: "power2.inOut" }, 6.1)
          .to("#world", { scale: 1, duration: 0.9, ease: "power3.inOut" }, 8.65);
        tl.fromTo("#bg", { scale: 1 }, { scale: 1.012, duration: 0.7, ease: "power2.inOut" }, 4.0)
          .to("#bg", { scale: 1.025, duration: 0.6, ease: "power2.inOut" }, 6.1)
          .to("#bg", { scale: 1, duration: 0.9, ease: "power3.inOut" }, 8.65);
        }

        // 1. The job starts the night.
        tl.fromTo("#job", { scaleX: 1, scaleY: 1 }, { scaleX: 1.04, scaleY: 0.93, duration: 0.1, ease: "power2.in", transformOrigin: "50% 92%" }, 0.3)
          .to("#job", { scaleX: 1, scaleY: 1, duration: 0.5, ease: "back.out(1.7)", transformOrigin: "50% 92%" }, 0.4);
        tl.fromTo("#job-glow", { opacity: 0.5, scale: 0.75 }, { opacity: 0, scale: 1.35, duration: 0.8, ease: "power2.out", immediateRender: false }, 0.4);

        // 2. Extraction: Performance Max rows stream out of Google Ads and stack into a new typed-history layer.
        const hit1 = fire(1, 0.45);
        tl.fromTo("#src", { x: 0 }, { x: -7, duration: 0.1, ease: "power2.out" }, hit1)
          .to("#src", { x: 0, duration: 0.4, ease: "power2.inOut" }, hit1 + 0.1);
        rows.forEach((r, i) => {
          const s = hit1 + 0.05 + i * 0.075, y0 = 292 + ((i * 29) % 96);
          tl.set(r, { x: 214, y: y0, autoAlpha: 0, scaleX: 1 }, 0)
            .to(r, { autoAlpha: 1, duration: 0.08 }, s)
            .to(r, { x: 359, duration: 0.8, ease: "power1.inOut" }, s)
            .to(r, { y: 214 + (i % 3) * 8, duration: 0.4, ease: "power2.out" }, s)
            .to(r, { y: slotTop + 58, duration: 0.4, ease: "power2.in" }, s + 0.4)
            .to(r, { scaleX: 0.35, autoAlpha: 0, duration: 0.12, ease: "power2.in" }, s + 0.74)
            .set(r, { x: 214, scaleX: 1 }, s + 0.9);
        });
        const land0 = hit1 + 0.85, land1 = hit1 + 0.05 + 13 * 0.075 + 0.8;
        tl.fromTo("#hn", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: land1 - land0, ease: "none" }, land0);
        // The layer is in; the stack settles by one layer and the oldest visible layer sinks out of view.
        tl.to(["#h0", "#h1", "#h2", "#hn"], { y: P, duration: 0.45, ease: "power2.inOut" }, land1 + 0.08)
          .to("#h0", { autoAlpha: 0, duration: 0.4, ease: "power1.in" }, land1 + 0.08)
          .set(["#h0", "#h1", "#h2"], { y: 0, autoAlpha: 1 }, land1 + 0.6)
          .set("#hn", { y: -10, autoAlpha: 0 }, land1 + 0.6);

        // 3. Transformation: history feeds the validated marts.
        const hit2 = fire(2, 3.1);
        sparks.forEach((sp, i) => {
          const s = hit2 + i * 0.08;
          tl.set(sp, { x: 360 + i * 16, y: slotTop + 50, autoAlpha: 0 }, 0)
            .set(sp, { autoAlpha: 1 }, s)
            .to(sp, { x: 566 + i * 18, duration: 0.5, ease: "power1.inOut" }, s)
            .to(sp, { y: 236, duration: 0.25, ease: "power2.out" }, s)
            .to(sp, { y: 318, duration: 0.25, ease: "power2.in" }, s + 0.25)
            .set(sp, { autoAlpha: 0 }, s + 0.5);
        });
        tl.fromTo("#lid", { y: 0 }, { y: 6, duration: 0.12, ease: "power2.out" }, hit2 + 0.5)
          .to("#lid", { y: 0, duration: 0.4, ease: "power2.inOut" }, hit2 + 0.62)
          .fromTo("#lid-sweep", { x: -130 }, { x: 200, duration: 0.6, ease: "power2.inOut" }, hit2 + 0.55);

        // 4. Validation: packets enter the gate, the laser scans them, the gate passes.
        fire(3, 4.2);
        const slots = [300, 330, 360, 390];
        pkts.forEach((k, i) => {
          const s = 4.5 + i * 0.06;
          tl.set(k, { x: 652, y: 318, autoAlpha: 0 }, 0)
            .set(k, { autoAlpha: 1 }, s)
            .to(k, { x: 772, y: slots[i], duration: 0.45, ease: "power2.out" }, s)
            .to(k, { x: 930, y: 322 + i * 18, duration: 0.4, ease: "power2.in" }, 6.0 + i * 0.04)
            .set(k, { autoAlpha: 0 }, 6.4 + i * 0.04);
        });
        tl.set("#laser", { attr: { y1: 16, y2: 16 }, opacity: 0 }, 0)
          .to("#laser", { opacity: 1, duration: 0.1 }, 5.0)
          .to("#laser", { attr: { y1: 160, y2: 160 }, duration: 0.38, ease: "sine.inOut" }, 5.0)
          .to("#laser", { attr: { y1: 16, y2: 16 }, duration: 0.38, ease: "sine.inOut" }, 5.38)
          .to("#laser", { opacity: 0, duration: 0.08 }, 5.7);
        tl.to("#portal-on", { opacity: 0.22, duration: 0.25, ease: "power2.out" }, 5.75)
          .fromTo("#pass", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1.7)", transformOrigin: "50% 50%" }, 5.75)
          .to("#portal-on", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 8.8)
          .to("#pass", { scale: 0, duration: 0.3, ease: "power2.in", transformOrigin: "50% 50%" }, 8.8);

        // 5. Publication: one transaction replaces all eight tables at once.
        fire(4, 6.05);
        tl.set(cards, { rotationX: 0, transformPerspective: 500 }, 0)
          .to(cards, { rotationX: 180, duration: 0.5, ease: "power3.inOut", transformPerspective: 500 }, 6.75)
          .fromTo("#plate-ring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.08, duration: 0.6, ease: "power2.out", transformOrigin: "50% 50%", immediateRender: false }, 7.05);

        // 6. Looker Studio reads the fresh tables and redraws.
        lpkts.forEach((k, i) => {
          const s = 7.2 + i * 0.07;
          tl.set(k, { x: 1180, y: 330 + i * 16, autoAlpha: 0 }, 0)
            .set(k, { autoAlpha: 1 }, s)
            .to(k, { x: 1345, y: 312 + i * 6, duration: 0.4, ease: "power2.in" }, s)
            .set(k, { autoAlpha: 0 }, s + 0.4);
        });
        const draw = 7.62;
        const newLine = document.querySelector("#chart-new .line"), Ln = newLine.getTotalLength();
        tl.set("#chart-new", { autoAlpha: 0 }, 0)
          .set(newLine, { strokeDasharray: Ln, strokeDashoffset: Ln }, 0)
          .set("#chart-new .area", { opacity: 0 }, 0)
          .to("#chart-old", { opacity: 0.1, duration: 0.2, ease: "power1.out" }, draw)
          .set("#chart-new", { autoAlpha: 1 }, draw + 0.05)
          .to(newLine, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, draw + 0.05)
          .to("#chart-new .area", { opacity: 1, duration: 0.5, ease: "power1.out" }, draw + 0.3)
          .set("#chart-old", { opacity: 1 }, draw + 0.9)
          .set("#chart-new", { autoAlpha: 0 }, draw + 0.9)
          .set(newLine, { strokeDashoffset: Ln }, draw + 0.9)
          .set("#chart-new .area", { opacity: 0 }, draw + 0.9);

        // 7. The job writes the run report.
        tl.set("#report", { autoAlpha: 0, x: -205, y: 30, scale: 0.4 }, 0)
          .set("#report", { autoAlpha: 1 }, 7.7)
          .to("#report", { x: 0, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 7.7);
        document.querySelectorAll("#report .rrow").forEach((row, k) => {
          const s = 7.95 + k * 0.12;
          tl.fromTo(row.querySelector(".tick"), { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, s)
            .fromTo(row.querySelector(".bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, s + 0.05);
        });
        tl.to("#report", { y: -22, autoAlpha: 0, duration: 0.45, ease: "power2.in" }, 8.75);   // rises and fades inside the frame

        // 8. The night completes: the reporting window moves forward one day and the new generation becomes current.
        tl.to("#strip .cells", { x: -34, duration: 0.8, ease: "power3.inOut" }, 8.7)
          .fromTo("#newday", { opacity: 0 }, { opacity: 0.8, duration: 0.15, ease: "power1.out" }, 9.3)
          .to("#newday", { opacity: 0, duration: 0.35, ease: "power1.in" }, 9.46)
          .set("#strip .cells", { x: 0 }, 9.85);
        const ovs = cards.map((c) => c.querySelector(".fresh-ov"));
        tl.set(ovs, { opacity: 0 }, 0)
          .set(ovs, { opacity: 1 }, 8.8)
          .set(cards, { rotationX: 0 }, 8.8)
          .to(ovs, { opacity: 0, duration: 0.9, ease: "power1.inOut" }, 8.85);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
